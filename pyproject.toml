[project]
name = "deeptalk-agent"
version = "1.0.0"
description = "Local podcast interview AI assistant with microphone input, ASR, LLM, and TTS playback with half-duplex interruption support"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "DeepTalk Team" }]
keywords = ["ai", "asr", "tts", "llm", "voice-assistant", "podcast", "mlx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core MLX dependencies (Apple Silicon)
    "mlx>=0.31.0",
    "mlx-audio>=0.4.0",
    "mlx-lm>=0.31.0",
    "mlx-vlm>=0.2.0",

    # Audio processing
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
    "librosa>=0.11.0",
    "webrtcvad>=2.0.10",

    # NLP & ML
    "transformers>=5.0.0",
    "tokenizers>=0.22.0",
    "huggingface-hub>=1.9.0",
    "safetensors>=0.7.0",
    "sentencepiece>=0.2.1",
    "spacy>=3.8.0",
    "ordered-set>=4.1.0",

    # Text processing
    "jieba>=0.42.0",
    "pypinyin>=0.55.0",
    "num2words>=0.5.0",
    "cn2an>=0.5.0",

    # TTS dependencies
    "phonemizer-fork>=3.3.0",
    "espeakng-loader>=0.2.0",
    "misaki>=0.9.0",
    "proces>=0.1.0",

    # Data processing
    "pandas>=2.0.0",
    "datasets>=4.0.0",

    # Web framework
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=13.1",
    "httpx>=0.28.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=14.0.0",
    "pydantic>=2.12.0",
    "click>=8.3.0",
    "tqdm>=4.67.0",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "opencv-python>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
deeptalk = "app.main:main"
deeptalk-server = "app.server:main"

[project.urls]
Homepage = "https://github.com/Young-Chin/DeepTalk-Agent"
Documentation = "https://github.com/Young-Chin/DeepTalk-Agent#readme"
Repository = "https://github.com/Young-Chin/DeepTalk-Agent"
Issues = "https://github.com/Young-Chin/DeepTalk-Agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
